<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Sign Up For Ai Powered Smart Study And Monitoring System</title>
</head>

<body>
    <section id="mainviewport">
        <div id="leftbox">

        </div>
        <div id="rightbox">
            <div id="loginform-content">
                <P id="welcome">WELCOME BACK</P>

                <P id="signin-text">Sign in to keep learning</P>

                <p id="dashboard-text">Your study dashboard and next focus session are waiting.</p>

                <!-- login form -->
                <form action="" method="get">

                    <div id="formcontent">
                        <label for="email">Email address</label>
                        <input id="Email" placeholder="enter your email">

                    </div>

                    <div id="formcontent">
                        <div id="password-box">

                            <label for="password">Password</label>

                            <a href="#">Forget password</a>

                        </div>

                        <input type="password" id="Password" placeholder="enter your password">
                    </div>
                    <!-- keep me signed in to -->
                    <div id="remember">
                        <input type="checkbox" id="checkbox">
                        <label for="keepmesignedin"> keep me signed in</label>

                    </div>


                    <button>Sign in to dashboard →</button>
                    <!-- lines -->
                    <div class="lines">
                        <span></span>
                        <p>NEW TO STUDY PILOT?</p>
                        <span></span>


                    </div>

                    <P class="account">
                        Start buliding smarter study habits.
                        <a href="#">Create a free account</a>

                    </P>

                    <p id="encrypt">
                        <span>

                        </span>
            </div>
    </section>
</body>

</html>
